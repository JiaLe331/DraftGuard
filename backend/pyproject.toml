[project]
name = "draftguard-api"
version = "0.1.0"
description = "DraftGuard API scaffold"
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml>=0.7,<1",
    "fastapi>=0.115,<1",
    "openpyxl>=3.1,<4",
    "pydantic-settings>=2,<3",
    "pypdf>=6,<7",
    "python-docx>=1.2,<2",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
